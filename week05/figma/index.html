<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>로그인 화면</title>
    <style>
        /* Reset & Base Styles */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #FFFFFF;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
        }

        /* Container: Login Screen (390x844 designed) */
        .login-screen {
            width: 100%;
            max-width: 390px;
            min-height: 844px;
            padding: 72px 24px 40px;
            display: flex;
            flex-direction: column;
            gap: 28px;
            background-color: #FFFFFF;
        }

        /* Header Section */
        .header {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .header h1 {
            font-size: 26px;
            font-weight: 700;
            color: #1C2430;
            text-align: left;
        }

        .header p {
            font-size: 15px;
            font-weight: 400;
            color: #667085;
            text-align: left;
        }

        /* Form Section */
        .form {
            display: flex;
            flex-direction: column;
            gap: 16px;
        }

        .field-group {
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .field-label {
            font-size: 13px;
            font-weight: 600;
            color: #667085;
        }

        .input-wrapper {
            display: flex;
            padding: 14px;
            background-color: #F7F7FA;
            border: 1px solid #DEE3E8;
            border-radius: 10px;
        }

        .input-wrapper input {
            width: 100%;
            border: none;
            background: transparent;
            outline: none;
            font-size: 15px;
            color: #667085;
        }

        .input-wrapper input::placeholder {
            color: #667085;
        }

        /* Button Section */
        .btn-primary {
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 16px 0;
            background-color: #2663EB;
            color: #FFFFFF;
            font-size: 16px;
            font-weight: 600;
            border: none;
            border-radius: 12px;
            cursor: pointer;
            width: 100%;
        }

        /* Footer Section */
        .footer {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 6px;
            margin-top: auto; /* Push to bottom if needed, but based on layout it's just after button */
        }

        .footer-text-gray {
            font-size: 14px;
            font-weight: 400;
            color: #667085;
        }

        .footer-text-blue {
            font-size: 14px;
            font-weight: 600;
            color: #2663EB;
            cursor: pointer;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="login-screen">
        <!-- Header -->
        <header class="header">
            <h1>다시 만나서 반갑습니다</h1>
            <p>학교 이메일로 로그인하세요</p>
        </header>

        <!-- Form -->
        <form class="form" onsubmit="return false;">
            <div class="field-group">
                <span class="field-label">이메일</span>
                <div class="input-wrapper">
                    <input type="email" placeholder="아이디@daelim.ac.kr">
                </div>
            </div>

            <div class="field-group">
                <span class="field-label">비밀번호</span>
                <div class="input-wrapper">
                    <input type="password" placeholder="8자 이상">
                </div>
            </div>

            <button type="submit" class="btn-primary">로그인</button>
        </form>

        <!-- Footer -->
        <footer class="footer">
            <span class="footer-text-gray">계정이 없으신가요?</span>
            <span class="footer-text-blue">회원가입</span>
        </footer>
    </div>
</body>
</html>
