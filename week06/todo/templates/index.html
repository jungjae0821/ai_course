<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo App</title>
    <style>
        body { font-family: sans-serif; max-width: 500px; margin: 2em auto; padding: 0 1em; }
        form { display: flex; gap: 0.5em; margin-bottom: 2em; }
        input[type="text"] { flex-grow: 1; padding: 0.5em; }
        ul { list-style: none; padding: 0; }
        li { padding: 0.5em; border-bottom: 1px solid #eee; display: flex; align-items: center; }
        .todo-item { display: flex; justify-content: space-between; align-items: center; }
    </style>
</head>
<body>
    <h1>할 일 관리</h1>

    <form action="/add" method="post">
        <input type="text" name="title" placeholder="새로운 할 일을 입력하세요" required>
        <button type="submit">추가</button>
    </form>

    <ul>
        {% for todo in todos %}
        <li>
            <div class="todo-item">
                <span>{{ todo.title }}</span>
                <small>{{ todo.created_at }}</small>
            </div>
        </li>
        {% endfor %}
    </ul>
</body>
</html>
